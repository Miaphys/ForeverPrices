name: Update prices

on:
  schedule:
    # Blizzard publishes new auction snapshots hourly (EU ~:19, US ~:17; big houses a few
    # minutes later). Two runs an hour: the second catches anything the first missed or
    # a schedule start that GitHub delayed.
    - cron: "24,46 * * * *"
  workflow_dispatch: {}
  # Landing page changes go live right away (not only when new prices arrive).
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # keep-alive below

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry2.outputs.page_url || steps.deploy_retry1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build price files
        id: build
        env:
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
          FORCE_DEPLOY: ${{ github.event_name == 'push' }}
        run: python server/build_prices.py --out site --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Configure Pages
        if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes looks for the artifact before GitHub has indexed it
      # ("Found 0 artifact(s)") right after a successful upload. That is transient, so
      # retry instead of failing the run (and mailing about it).
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.build.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deploy_retry1
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying deploy again
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deploy_retry2
        if: steps.build.outputs.changed == 'true' && steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub switches off scheduled workflows in public repos after 60 days without
      # commits. Re-enabling it on every run keeps the hourly job alive.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable prices.yml --repo "${{ github.repository }}" || true
